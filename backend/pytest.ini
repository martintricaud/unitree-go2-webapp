# Run from this directory: `venv/bin/pytest`. From the repo root pytest finds no config,
# so pass it explicitly: `backend/venv/bin/pytest -c backend/pytest.ini backend/tests`.
[pytest]
testpaths = tests
# auto collects `async def` tests without a per-test marker, which pytest-asyncio
# documents as the recommendation for an asyncio-only project.
asyncio_mode = auto
